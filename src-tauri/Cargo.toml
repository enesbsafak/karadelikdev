[package]
name = "karadelikdev"
version = "1.4.0"
description = "KaradelikDev - yerel geliştirme ortamı yöneticisi"
edition = "2021"

[lib]
name = "karadelikdev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
regex = "1"
rust-ini = "0.21"
chrono = "0.4"
time = "0.3"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
sha2 = "0.10"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_Security_Authorization"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
