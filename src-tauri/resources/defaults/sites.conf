# KaradelikDev - Hızlı uygulama (Menü > Hızlı uygulama)
# Biçim: ad=URL veya ad=komut   (%s = proje adı)

# Seçenekler
AutoCreateDatabase=true

# Boş proje
Blank=

# WordPress
WordPress=https://wordpress.org/latest.tar.gz
---

# Laravel
Laravel=composer create-project laravel/laravel %s --prefer-dist
---

# Symfony
Symfony=composer create-project symfony/skeleton %s

# CodeIgniter
CodeIgniter=composer create-project codeigniter4/appstarter %s
