# KaradelikDev - Hızlı ekle (Menü > Araçlar > Hızlı ekle)
# Biçim: ad=brew:formül veya ad=URL   Adın ilk parçası hedef klasörü belirler (php-8.4 -> bin/php/php-8.4)
# brew: Homebrew ile kurulur; bin/<kategori>/<ad>-<sürüm> Homebrew klasörüne bağlantı olur. Servisler `brew services`
#       ile değil, KaradelikDev'in etc/ altında ürettiği ayarlarla çalışır; Homebrew'un ayar dosyalarına dokunulmaz.
# URL: .zip, .tar.gz, .tar.xz arşivleri açılır; tek dosyalar (.phar, .php) doğrudan kopyalanır. {arch}: arm64 / amd64
# * ile başlayanlar ilk kurulumda önerilir.

# PHP - Apache'de mod_php (libphp.so), Nginx ve proje başına sürümlerde php-cgi havuzu
php-8.5=brew:php
*php-8.4=brew:php@8.4
php-8.3=brew:php@8.3
php-8.2=brew:php@8.2
---
# Web sunucuları
*apache=brew:httpd
nginx=brew:nginx
---
# Veritabanları
*mysql-8.4=brew:mysql@8.4
mysql=brew:mysql
mariadb=brew:mariadb
mariadb-11.8=brew:mariadb@11.8
mariadb-11.4=brew:mariadb@11.4
postgresql-18=brew:postgresql@18
postgresql-17=brew:postgresql@17
mongodb-8.0=brew:mongodb/brew/mongodb-community@8.0
redis=brew:redis
memcached=brew:memcached
---
# Dil çalışma ortamları
node-24=brew:node@24
node-22=brew:node@22
python-3.13=brew:python@3.13
go=brew:go
---
# Araçlar
*composer=https://getcomposer.org/download/latest-stable/composer.phar
*mailpit=brew:mailpit
cloudflared=brew:cloudflared
ngrok=https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-{arch}.zip
---
# Web yönetim panelleri (etc/apps altına kurulur, http://localhost/<ad>)
*phpmyadmin=https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-english.zip
adminer=https://github.com/vrana/adminer/releases/download/v6.1.2/adminer-6.1.2.php
