# Windows sürüm paketi: scripts\release.ps1 ile NSIS kurulum programı, SHA256SUMS.txt ve latest.json üretir ve
# "windows-dist" yapıtı olarak yükler. Sürüm GitHub'da elle yayımlanır: yapıt Mac'teki dist/ klasörüne indirilir,
# `bash scripts/release.sh --universal` macOS paketlerini ekler, ardından `gh release create`.
name: Windows sürüm paketi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: release.ps1
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/
          if-no-files-found: error
