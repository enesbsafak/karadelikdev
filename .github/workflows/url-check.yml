# Haftalık indirme adresi denetimi: varsayılan paket listelerindeki adreslerden biri kırılırsa iş başarısız olur
# ve GitHub e-posta gönderir (kullanıcılar Hızlı ekle'de 404 görmeden önce).
name: Adres denetimi

on:
  schedule:
    - cron: "17 6 * * 1" # her pazartesi 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src-tauri/resources/defaults/packages*.conf
      - src-tauri/resources/defaults/sites.conf
      - scripts/check-urls.sh
      - .github/workflows/url-check.yml

permissions:
  contents: read

jobs:
  links:
    name: Sabit adresler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-urls.sh

  rolling:
    name: PHP ve Apache güncel derleme
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: rolling_sources_resolve
        shell: bash
        run: cd src-tauri && cargo test --lib -- --ignored rolling_sources_resolve --nocapture
