<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaradelikDev</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand">
      <img src="img/logo.png" alt="" draggable="false">
      <button class="menu-btn" id="menuBtn"><span data-i18n="btn.menu">Menü</span><span class="caret">▼</span></button>
    </div>
    <div class="title-spacer" data-tauri-drag-region></div>
    <div class="title-tools">
      <span class="chip" id="profileChip" title="Profil">[default]</span>
      <button class="icon-btn" id="hostsBtn" data-i18n-title="ui.hosts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/></svg>
      </button>
      <button class="icon-btn" id="helpBtn" data-i18n-title="ui.help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5h.01"/></svg>
      </button>
      <button class="icon-btn" id="prefsBtn" data-i18n-title="ui.prefs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="icon-btn win-btn" id="minBtn" data-i18n-title="ui.minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <button class="icon-btn win-btn close" id="closeBtn" data-i18n-title="ui.close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <div class="notice hidden" id="updateNotice">
    <span id="updateText"></span>
    <button class="btn primary" id="updateBtn" data-i18n="btn.update">Güncelle</button>
  </div>

  <div class="notice hidden" id="laragonNotice">
    <span id="laragonText"></span>
    <button class="btn primary" id="importBtn" data-i18n="ui.import">İçe aktar</button>
  </div>

  <main class="main">
    <div id="services"></div>
    <div class="empty hidden" id="empty">
      <img src="img/logo.png" width="56" alt="">
      <h2 data-i18n="ui.empty_title"></h2>
      <div data-i18n="ui.empty_text"></div>
    </div>
    <div class="section-title">
      <span><span data-i18n="ui.projects">Projeler</span> · <a href="#" id="manageProjects" data-i18n="ui.manage">Yönet</a></span>
      <span id="docroot" class="svc-ver"></span>
    </div>
    <div class="projects" id="projects"></div>
  </main>

  <footer class="bottom">
    <div class="actions">
      <button class="action start" id="startBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
        <span id="startLabel" data-i18n="btn.start_all">Tümünü Başlat</span>
      </button>
      <button class="action" data-action="web">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span data-i18n="btn.web">Web</span>
      </button>
      <button class="action" data-action="db">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        <span data-i18n="btn.database">Veritabanı</span>
      </button>
      <button class="action" data-action="terminal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>
        <span data-i18n="btn.terminal">Terminal</span>
      </button>
      <button class="action" data-action="root">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
        <span data-i18n="btn.root">Kök</span>
      </button>
    </div>
    <div class="statusbar">
      <span class="msg" id="status"></span>
      <div class="progress hidden" id="progress"><div></div></div>
    </div>
  </footer>
</div>
<script src="js/common.js"></script>
<script src="js/main.js"></script>
</body>
</html>
